name: check

on: [push, pull_request]

# The workflow's token can only read the repo.
permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: No secrets or personal settings committed
        run: |
          bad=0
          # Files that only exist on a real installation.
          for f in $(git ls-files); do
            case "$f" in
              server/config.php|dashboard/config.php|*/secret/*|*.enc|*token_setup.txt|*anthropic_setup.txt|*dashboard_key*|*client_secret*.json|*youtube_setup_*.json|pc-tools/*/accounts/*|pc-tools/*/config.json|pc-tools/summarize/summaries/*|server/channels.json|server/recordings/*|docker/.env|*/.env)
                echo "::error file=$f::this file must not be in the repository"; bad=1 ;;
            esac
          done
          # Things that look like keys or tokens inside files.
          if git grep -nIE -e '-----BEGIN [A-Z ]*PRIVATE KEY-----' -e '1//0[A-Za-z0-9_-]{20,}' -e 'ya29\.[A-Za-z0-9_-]{20,}' -e 'GOCSPX-[A-Za-z0-9_-]{10,}' -e 'REC_KEY=[A-Za-z0-9]{16,}' -e 'sk-ant-[A-Za-z0-9_-]{30,}' -- . ':!.github/workflows/check.yml' ':!docs/*' ':!*.md'; then
            echo "::error::something that looks like a key or token is committed"; bad=1
          fi
          exit $bad

  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.0'
      - name: PHP syntax (8.0, the minimum)
        run: for f in server/*.php dashboard/*.php; do php -l "$f"; done
      - name: Recorder and dashboard have the same version
        run: |
          r=$(grep -oP "const RECORDER_VERSION = '\K[0-9.]+" server/record.php)
          d=$(grep -oP "const DASHBOARD_VERSION = '\K[0-9.]+" dashboard/index.php)
          echo "record.php $r, dashboard $d"; test -n "$r" && test "$r" = "$d"
      - name: Automated tests (server)
        run: php tests/run.php
      - name: Automated tests (PC summary tool)
        run: python3 -m unittest discover -s tests -p "test_*.py"
      - name: JavaScript syntax
        run: |
          for f in dashboard/player.html dashboard/index.php dashboard/text.html; do
            python3 - "$f" <<'PY'
          import sys
          src = open(sys.argv[1], encoding='utf-8').read()
          a = src.rindex('<script>') + len('<script>'); b = src.rindex('</script>')
          open('/tmp/check.js', 'w').write(src[a:b])  # the page script (the last one)
          PY
            node --check /tmp/check.js
          done
      - name: Scan page syntax (module script)
        run: |
          python3 - <<'PY'
          src = open('dashboard/scan.html', encoding='utf-8').read()
          a = src.rindex('<script type="module">') + len('<script type="module">'); b = src.rindex('</script>')
          open('/tmp/scan.mjs', 'w').write(src[a:b])
          PY
          node --check /tmp/scan.mjs
      - name: Players and scan pages are identical
        run: |
          cmp dashboard/player.html pc-tools/player/player.html
          cmp dashboard/scan.html pc-tools/scan/scan.html
      - name: Python syntax
        run: python3 -m py_compile pc-tools/youtube-uploader/yt_uploader.py pc-tools/summarize/summarize.py
      - name: Shell syntax
        run: bash -n start-local.sh

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build the Docker image
        run: docker build -f docker/Dockerfile -t stream-recorder:test .
      - name: Start it and check the dashboard, the recorder and the tools
        run: |
          docker run -d --name sr -e REC_KEY=ci0123456789abcdefgh -e TZ=Europe/Amsterdam -p 8080:8080 stream-recorder:test
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8080/ -o page.html && grep -q "Dashboard key" page.html && break; sleep 2; done
          grep -q "Dashboard key" page.html
          docker logs sr | grep -q "Dashboard key ("
          docker exec sr php -r '$s = json_decode(file_get_contents("/data/server/recordings/.settings.json"), true); exit(!empty($s["ffmpeg"]) && $s["rec_key"] === "ok" && $s["ext"]["gd"] && $s["ext"]["font"] ? 0 : 1);'
          docker exec sr sh -c 'test ! -e /opt/stream-recorder/server/config.php && test ! -e /opt/stream-recorder/server/secret'
          docker stop sr
