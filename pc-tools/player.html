<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stream player</title>
<style>
  :root { --bg: #0e0f13; --panel: #17181f; --line: #262833; --text: #e8e9ee; --muted: #8e93a3; --accent: #9b87ff; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 14px; padding: 10px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header h1 { font-size: 15px; margin: 0; font-weight: 650; }
  #info { color: var(--muted); font-size: 13px; flex: 1; min-width: 200px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #info b { color: var(--text); font-weight: 600; }
  button, label.btn { background: #232532; color: var(--text); border: 1px solid #323544; border-radius: 8px; padding: 6px 11px; font: inherit; font-size: 13px; cursor: pointer; white-space: nowrap; }
  button:hover, label.btn:hover { background: #2c2f3f; }
  button.primary, label.primary { background: var(--accent); border-color: var(--accent); color: #111; font-weight: 600; }
  .group { display: flex; gap: 6px; align-items: center; }
  .group .lbl { color: var(--muted); font-size: 12px; }
  #offset { font-variant-numeric: tabular-nums; min-width: 52px; text-align: center; font-size: 13px; }
  main { flex: 1; display: flex; min-height: 0; }
  #stage { flex: 1; display: flex; align-items: center; justify-content: center; background: #000; min-width: 0; }
  video { width: 100%; height: 100%; max-height: calc(100vh - 54px); background: #000; outline: none; }
  #stage { position: relative; overflow: hidden; }
  #stage:fullscreen video { max-height: 100vh; }
  #stage.idle { cursor: none; }
  /* custom controls, YouTube-style */
  #controls { position: absolute; left: 0; right: 0; bottom: 0; padding: 26px 14px 8px; background: linear-gradient(transparent, rgba(0,0,0,.75)); transition: opacity .2s; }
  #stage.idle #controls { opacity: 0; pointer-events: none; }
  #seek { position: relative; height: 18px; display: flex; align-items: center; cursor: pointer; }
  #seek .track { position: relative; height: 4px; width: 100%; background: rgba(255,255,255,.25); border-radius: 2px; transition: height .1s; }
  #seek:hover .track { height: 6px; }
  #seek .track i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 2px; width: 0; }
  #seekBuf { background: rgba(255,255,255,.35); }
  #seekPlay { background: var(--accent); }
  #seekKnob { position: absolute; top: 50%; width: 13px; height: 13px; margin: -6.5px 0 0 -6.5px; border-radius: 50%; background: var(--accent); transform: scale(0); transition: transform .1s; pointer-events: none; }
  #seek:hover #seekKnob { transform: scale(1); }
  #seekMarks { position: absolute; left: 0; right: 0; top: 50%; height: 0; pointer-events: none; }
  #seekMarks b { position: absolute; top: -7px; width: 2px; height: 14px; margin-left: -1px; background: #ffd75e; border-radius: 1px; opacity: .9; }
  #preview { position: absolute; bottom: 24px; transform: translateX(-50%); display: none; flex-direction: column; align-items: center; gap: 4px; pointer-events: none; }
  #seek:hover #preview { display: flex; }
  #preview canvas { width: 192px; height: 108px; border-radius: 8px; border: 2px solid rgba(255,255,255,.9); background: #111; box-shadow: 0 4px 16px rgba(0,0,0,.5); }
  #preview canvas.none { display: none; }
  #pvTime { font-size: 13px; font-weight: 600; text-shadow: 0 1px 3px #000; font-variant-numeric: tabular-nums; }
  #ctrlRow { display: flex; align-items: center; gap: 4px; margin-top: 4px; }
  #ctrlRow .grow { flex: 1; }
  #ctrlRow button.ic { background: none; border: 0; padding: 6px; width: 34px; height: 34px; display: inline-flex; align-items: center; justify-content: center; border-radius: 6px; }
  #ctrlRow button.ic:hover { background: rgba(255,255,255,.12); }
  #ctrlRow svg { width: 22px; height: 22px; fill: #fff; }
  #cVol { width: 80px; accent-color: #fff; }
  #cTime { font-size: 13px; margin-left: 8px; font-variant-numeric: tabular-nums; color: #eee; }
  #cRate { background: rgba(0,0,0,.4); color: #fff; border: 1px solid rgba(255,255,255,.25); border-radius: 6px; font: inherit; font-size: 12px; padding: 3px 4px; margin-right: 4px; }
  /* chat search bar */
  .chatbar { display: flex; gap: 6px; align-items: center; padding: 8px 10px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .chatbar input[type=search] { flex: 1; min-width: 120px; background: var(--bg); border: 1px solid var(--line); color: var(--text); border-radius: 7px; padding: 5px 9px; font: inherit; font-size: 13px; }
  .chatbar input:focus { outline: none; border-color: var(--accent); }
  .chatbar select, .chatbar button { font-size: 12px; padding: 4px 8px; }
  .chatbar select { background: #232532; color: var(--text); border: 1px solid #323544; border-radius: 7px; font: inherit; font-size: 12px; }
  .chatbar .info { width: 100%; color: var(--muted); font-size: 12px; }
  .chatbar .info:empty { display: none; }
  .chatbar .me { display: flex; gap: 6px; align-items: center; width: 100%; font-size: 12px; color: var(--muted); }
  .chatbar .me input { flex: 1; background: var(--bg); border: 1px solid var(--line); color: var(--text); border-radius: 7px; padding: 4px 8px; font: inherit; font-size: 12px; }
  .msg.result { cursor: pointer; border-radius: 4px; padding-left: 4px; }
  .msg.result:hover { background: rgba(255,255,255,.05); }
  .msg.mine { background: rgba(155,135,255,.16); border-left: 3px solid var(--accent); padding-left: 6px; border-radius: 3px; }
  .msg.mention { background: rgba(255,215,94,.12); border-left: 3px solid #ffd75e; padding-left: 6px; border-radius: 3px; }
  mark { background: rgba(255,215,94,.35); color: inherit; border-radius: 2px; padding: 0 1px; }
  #dock { width: 360px; border-left: 1px solid var(--line); background: var(--panel); display: none; flex-direction: column; min-height: 0; }
  #dock.show { display: flex; }
  #dockChat { flex: 1; overflow-y: auto; padding: 8px 10px; }
  #dock { flex-direction: column; }
  #start { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: var(--bg); z-index: 5; }
  .startbox { max-width: 520px; text-align: center; padding: 24px; }
  .startbox h2 { margin: 0 0 8px; font-size: 22px; }
  .startbox p { color: var(--muted); margin: 0 0 20px; }
  .startbox .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .startbox small { display: block; color: var(--muted); margin-top: 18px; font-size: 12px; }
  #drop { border: 2px dashed #333646; border-radius: 14px; padding: 28px; transition: border-color .15s; }
  #drop.over { border-color: var(--accent); }
  input[type=file] { display: none; }
  a.btn { background: #232532; color: var(--text); border: 1px solid #323544; border-radius: 8px; padding: 6px 11px; font-size: 13px; text-decoration: none; }
  a.btn.primary { background: var(--accent); border-color: var(--accent); color: #111; font-weight: 600; }
  button:disabled { opacity: .45; cursor: default; }
  .dlbar { height: 8px; background: #232532; border-radius: 4px; overflow: hidden; margin: 20px 0 8px; }
  .dlbar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s; }
  .dlstatus { font-variant-numeric: tabular-nums; min-height: 1.4em; margin: 8px 0; }
  .dlstatus.err { color: #ff8080; }
  #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #2a2d3b; border: 1px solid #3a3e50; padding: 10px 16px; border-radius: 10px; display: none; z-index: 9; max-width: 90vw; }
  /* chat styles (also injected into the pop-up) */
  .msg { padding: 3px 0; word-wrap: break-word; font-size: var(--chat-size, 14px); }
  .msg .ts { color: var(--muted); font-size: .8em; margin-right: 6px; font-variant-numeric: tabular-nums; cursor: pointer; }
  .msg .ts:hover { color: var(--accent); text-decoration: underline; }
  .msg .name { font-weight: 700; }
  .msg.trd .body { font-style: italic; }
  .chatbar button.on { border-color: var(--accent); color: var(--accent); }
  #cSubs { background: rgba(0,0,0,.4); color: #fff; border: 1px solid rgba(255,255,255,.25); border-radius: 6px; font: inherit; font-size: 12px; padding: 3px 4px; margin-right: 4px; max-width: 170px; }
  video::cue { background: rgba(0,0,0,.7); font-size: 1.05em; }
  .msg.sys { color: #c9b8ff; background: rgba(155,135,255,.08); border-left: 3px solid var(--accent); padding: 4px 8px; margin: 3px 0; border-radius: 4px; }
  .msg.mod { color: var(--muted); font-style: italic; }
  .msg.act { font-style: italic; }
</style>
</head>
<body>
<header>
  <h1>Stream player</h1>
  <div id="info">No recording loaded</div>
  <div class="group">
    <span class="lbl">Chat sync</span>
    <button data-off="-5" title="Chat earlier">−5s</button>
    <button data-off="-1">−1s</button>
    <span id="offset">0.0s</span>
    <button data-off="1">+1s</button>
    <button data-off="5" title="Chat later">+5s</button>
  </div>
  <div class="group">
    <button id="popBtn" class="primary">Pop out chat</button>
    <button id="dockBtn">Dock chat</button>
    <button id="saveChatBtn" style="display:none" title="Save a chat.txt with the sync info built in, so meta.json is no longer needed">Save chat with sync info</button>
    <label class="btn" for="pickDir" title="Open another recording">Open…</label>
  </div>
</header>
<main>
  <div id="stage">
    <video id="video" playsinline></video>
    <div id="controls">
      <div id="seek" title="">
        <div class="track"><i id="seekBuf"></i><i id="seekPlay"></i></div>
        <div id="seekMarks"></div>
        <div id="seekKnob"></div>
        <div id="preview"><canvas id="pvCanvas" width="192" height="108"></canvas><span id="pvTime">0:00</span></div>
      </div>
      <div id="ctrlRow">
        <button id="cPlay" class="ic" title="Play (Space)"></button>
        <button id="cBack" class="ic" title="Back 10 s (←)"></button>
        <button id="cFwd" class="ic" title="Forward 10 s (→)"></button>
        <button id="cMute" class="ic" title="Mute (M)"></button>
        <input id="cVol" type="range" min="0" max="1" step="0.05" value="1" title="Volume">
        <span id="cTime">0:00 / 0:00</span>
        <span class="grow"></span>
        <select id="cSubs" title="Subtitles (from the PC scan)" style="display:none"></select>
        <select id="cRate" title="Playback speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="2">2×</option></select>
        <button id="cFull" class="ic" title="Fullscreen (F)"></button>
      </div>
    </div>
  </div>
  <aside id="dock"><div class="chatbar" id="dockBar"></div><div id="dockChat"></div></aside>
</main>

<div id="start">
  <div class="startbox">
    <div id="drop">
      <h2>Open a recording</h2>
      <p>Choose a recording folder, or drop <code>video.mp4</code> and <code>chat.txt</code> here.</p>
      <div class="row">
        <label class="btn primary" for="pickDir">Choose folder</label>
        <label class="btn" for="pickFiles">Choose files</label>
      </div>
      <small>Everything stays on your computer - nothing is uploaded.<br>Shortcuts: Space/K play/pause · ←/→ 5 s · M mute · F fullscreen · C pop out chat</small>
    </div>
  </div>
</div>
<input type="file" id="pickDir" webkitdirectory directory multiple>
<input type="file" id="pickFiles" multiple accept="video/*,.mp4,.mkv,.webm,.mov,.ts,.txt,.json,.vtt">
<div id="toast"></div>

<script>
(function () {
  'use strict';
  const video = document.getElementById('video');
  const dock = document.getElementById('dock');
  const dockChat = document.getElementById('dockChat');
  const toastEl = document.getElementById('toast');
  const COLORS = ['#ff7a7a', '#ffb86b', '#ffe066', '#8be38b', '#5fd3c6', '#6cb6ff', '#a08bff', '#ff8fd8', '#ff9f43', '#7bed9f', '#70a1ff', '#eccc68', '#ff6b81', '#2ed573', '#1e90ff', '#c56cf0'];

  let messages = [];        // {t: seconds into video (before offset), clock, name, text, kind}
  let offset = 0;           // user nudge, seconds (+ = chat later)
  let shownUntil = -1;      // index of last rendered message
  let popup = null;
  let mode = 'dock';        // 'dock' | 'popup'
  let storageKey = null;
  let chatSize = 14;
  let videoUrl = null;
  let title = 'Stream chat';
  let search = { q: '', field: 'name' };   // chat search; q = '' shows the live chat
  let meName = '';                          // your Twitch name: your messages and @mentions are highlighted
  let mePinned = false;                     // set by hand in the player (wins over the dashboard's)
  try { meName = localStorage.getItem('stream-player-me') || ''; mePinned = !!meName; } catch (e) {}
  if (!meName && window.PLAYER_SOURCE && window.PLAYER_SOURCE.me) meName = String(window.PLAYER_SOURCE.me);

  function toast(msg, ms) {
    toastEl.textContent = msg;
    toastEl.style.display = 'block';
    clearTimeout(toast._t);
    toast._t = setTimeout(() => { toastEl.style.display = 'none'; }, ms || 4000);
  }

  // "2026-11-17 17:26:24(.123)" as local time -> ms. chat.txt and meta.json use the same format,
  // so they line up regardless of this computer's time zone.
  function parseLocal(s) {
    const m = /^(\d{4})-(\d\d)-(\d\d)[ T](\d\d):(\d\d):(\d\d)(?:\.(\d{1,3}))?/.exec(s || '');
    if (!m) return null;
    return new Date(+m[1], m[2] - 1, +m[3], +m[4], +m[5], +m[6], +(m[7] || '0').padEnd(3, '0')).getTime();
  }

  function colorFor(name) {
    let h = 0;
    for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0;
    return COLORS[h % COLORS.length];
  }

  function fmt(sec) {
    const neg = sec < 0; sec = Math.abs(Math.floor(sec));
    const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
    return (neg ? '-' : '') + (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(s).padStart(2, '0');
  }

  // meta.timeline: [[video seconds, "local time"], ...] at each recorded part. Ad breaks and gaps are
  // not in the video, so chat time -> video time is mapped per part.
  function makeMapper(meta, startMs) {
    const tl = (meta.timeline || []).map(([v, t]) => [v, parseLocal(t)]).filter(x => x[1] != null);
    if (!tl.length) return startMs != null ? (ms => (ms - startMs) / 1000) : null;
    return ms => {
      let i = 0;
      while (i + 1 < tl.length && tl[i + 1][1] <= ms) i++;
      let t = tl[i][0] + (ms - tl[i][1]) / 1000;
      if (i + 1 < tl.length) t = Math.min(t, tl[i + 1][0]); // said during an ad break: show at the cut
      return t;
    };
  }

  // ------------------------------------------------------------ PC-scan extras: subtitles and translated chat
  let chatTr = null, chatTrLang = '', showTr = false;
  try { showTr = localStorage.getItem('stream-player-chat-tr') !== '0'; } catch (e) {}
  function langName(c) { if (!c) return ''; try { return new Intl.DisplayNames(['en'], { type: 'language' }).of(c) || c; } catch (e) { return c; } }
  /** subs: [{url, lang, original}], chatTrs: [{lang, text}] */
  function setupExtras(subs, chatTrs) {
    video.querySelectorAll('track').forEach(t => t.remove());
    const sel = document.getElementById('cSubs');
    sel.replaceChildren(new Option('Subtitles off', 'off'));
    subs.forEach((x, i) => {
      const t = document.createElement('track');
      t.kind = 'subtitles'; t.src = x.url; t.srclang = x.lang || 'und';
      t.label = x.original ? 'Spoken' + (x.lang ? ' (' + langName(x.lang) + ')' : '') : langName(x.lang) + ' (translated)';
      video.appendChild(t);
      sel.appendChild(new Option(t.label, String(i)));
    });
    sel.style.display = subs.length ? '' : 'none';
    const apply = () => {
      [...video.textTracks].forEach((tt, i) => { tt.mode = String(i) === sel.value ? 'showing' : 'disabled'; });
    };
    let pref = 'off';
    try { pref = localStorage.getItem('stream-player-subs') || 'off'; } catch (e) {}
    // Remembered as "translated"/"spoken", so the choice carries over between recordings.
    const idx = pref === 'off' ? -1 : subs.findIndex(x => pref === 'spoken' ? x.original : !x.original);
    sel.value = idx >= 0 ? String(idx) : 'off';
    sel.onchange = () => {
      const x = subs[+sel.value];
      try { localStorage.setItem('stream-player-subs', sel.value === 'off' ? 'off' : (x && x.original ? 'spoken' : 'translated')); } catch (e) {}
      apply(); sel.blur();
    };
    setTimeout(apply, 0);
    chatTr = null; chatTrLang = '';
    for (const c of chatTrs) {
      try { const j = JSON.parse(c.text); if (j && j.map) { chatTr = j.map; chatTrLang = j.target || c.lang; break; } } catch (e) {}
    }
  }
  /** Extras from files in a local folder. */
  function extrasFromFiles(files) {
    const subs = files.filter(f => /^subtitles(\.[a-z-]+)?\.vtt$/i.test(f.name))
      .map(f => { const m = /^subtitles\.([a-z-]+)\.vtt$/i.exec(f.name); return { url: URL.createObjectURL(f), lang: m ? m[1] : '', original: !m }; })
      .sort((a, b) => (b.original ? 1 : 0) - (a.original ? 1 : 0));
    const chats = files.filter(f => /^chat_translation\.[a-z-]+\.json$/i.test(f.name));
    return { subs, chats };
  }

  function parseChat(text, startMs, mapper) {
    const out = [];
    const re = /^\[(\d{4}-\d\d-\d\d \d\d:\d\d:\d\d(?:\.\d+)?)\] (.*)$/;
    let firstMs = null;
    for (const line of text.split(/\r?\n/)) {
      const m = re.exec(line);
      if (!m) continue;
      const ms = parseLocal(m[1]);
      if (firstMs === null) firstMs = ms;
      let body = m[2], kind = 'chat', name = '', txt = body;
      if (body.startsWith('** ')) { kind = /was (banned|timed out)|cleared/.test(body) ? 'mod' : 'sys'; txt = body.slice(3); }
      else if (body.startsWith('* ')) { kind = 'act'; const p = body.slice(2).indexOf(' '); name = body.slice(2, 2 + p); txt = body.slice(3 + p); }
      else { const p = body.indexOf(': '); if (p > 0 && p < 40) { name = body.slice(0, p); txt = body.slice(p + 2); } }
      out.push({ ms, clock: m[1].slice(11, 19), name, text: txt, kind });
    }
    const base = startMs != null ? startMs : firstMs;
    out.forEach(x => { x.t = mapper ? mapper(x.ms) : (x.ms - base) / 1000; });
    out.sort((a, b) => a.t - b.t);
    return out;
  }

  // ------------------------------------------------------------ rendering
  function isMine(m) { return !!meName && !!m.name && m.name.toLowerCase() === meName.toLowerCase(); }
  function mentionsMe(m) {
    if (!meName || isMine(m)) return false;
    const n = meName.toLowerCase().replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    return new RegExp('(^|[^a-z0-9_])@?' + n + '($|[^a-z0-9_])', 'i').test(m.text);
  }
  /** Text with the search term marked (as text nodes, never HTML). */
  function markText(doc, parent, text, q) {
    if (!q) { parent.appendChild(doc.createTextNode(text)); return; }
    const lo = text.toLowerCase(), ql = q.toLowerCase();
    let i = 0, j;
    while ((j = lo.indexOf(ql, i)) !== -1) {
      if (j > i) parent.appendChild(doc.createTextNode(text.slice(i, j)));
      const mk = doc.createElement('mark'); mk.textContent = text.slice(j, j + q.length); parent.appendChild(mk);
      i = j + q.length;
    }
    if (i < text.length) parent.appendChild(doc.createTextNode(text.slice(i)));
  }
  function msgEl(doc, m, asResult) {
    const d = doc.createElement('div');
    d.className = 'msg' + (m.kind !== 'chat' ? ' ' + m.kind : '') + (isMine(m) ? ' mine' : mentionsMe(m) ? ' mention' : '') + (asResult ? ' result' : '');
    if (asResult) d.addEventListener('click', () => { video.currentTime = Math.max(0, m.t + offset - 3); video.play(); });
    const ts = doc.createElement('span');
    ts.className = 'ts';
    ts.textContent = fmt(m.t + offset);
    ts.title = 'Jump to this moment (' + m.clock + ')';
    ts.addEventListener('click', () => { video.currentTime = Math.max(0, m.t + offset - 3); video.play(); });
    d.appendChild(ts);
    if (m.name) {
      const n = doc.createElement('span');
      n.className = 'name';
      n.style.color = colorFor(m.name);
      markText(doc, n, m.name, asResult && search.field === 'name' ? search.q : '');
      d.appendChild(n);
      d.appendChild(doc.createTextNode(m.kind === 'act' ? ' ' : ': '));
    }
    const tr = showTr && chatTr && !asResult ? chatTr[m.text] : null;
    if (tr) {
      d.classList.add('trd');
      const b = doc.createElement('span'); b.className = 'body'; b.textContent = tr; b.title = 'Original: ' + m.text;
      d.appendChild(b);
    } else {
      markText(doc, d, m.text, asResult && search.field === 'text' ? search.q : '');
    }
    return d;
  }

  function container() {
    if (mode === 'popup' && popup && !popup.closed) return popup.document.getElementById('chat');
    return dockChat;
  }

  // Index of last message whose time <= t (binary search).
  function lastIndexAt(t) {
    let lo = 0, hi = messages.length - 1, ans = -1;
    while (lo <= hi) {
      const mid = (lo + hi) >> 1;
      if (messages[mid].t + offset <= t) { ans = mid; lo = mid + 1; } else hi = mid - 1;
    }
    return ans;
  }

  function nearBottom(c) { return c.scrollHeight - c.scrollTop - c.clientHeight < 60; }

  // ------------------------------------------------------------ chat search
  function searchResults() {
    const q = search.q.toLowerCase();
    if (!q) return [];
    return messages.filter(m => (search.field === 'name' ? (m.name || '') : m.text).toLowerCase().includes(q));
  }
  function renderResults(c) {
    const doc = c.ownerDocument;
    const res = searchResults();
    const frag = doc.createDocumentFragment();
    res.slice(0, 2000).forEach(m => frag.appendChild(msgEl(doc, m, true)));
    if (!res.length) frag.appendChild(Object.assign(doc.createElement('div'), { className: 'msg mod', textContent: 'No messages found.' }));
    c.replaceChildren(frag);
    c.scrollTop = 0;
    setSearchInfo(res.length ? res.length + (res.length === 1 ? ' message' : ' messages') + (res.length > 2000 ? ' (first 2000 shown)' : '')
      + ' - click one to jump there' : '');
    drawMarks(res);
  }
  function setSearchInfo(t) { forEachBar(b => { b.querySelector('.info').textContent = t; }); }
  function forEachBar(fn) {
    fn(document.getElementById('dockBar'));
    if (popup && !popup.closed) { const b = popup.document.getElementById('popBar'); if (b) fn(b); }
  }
  function setSearch(q, field) {
    search.q = q;
    if (field) search.field = field;
    forEachBar(b => {
      const i = b.querySelector('input[type=search]'); if (i.value !== q) i.value = q;
      b.querySelector('select').value = search.field;
      i.placeholder = search.field === 'name' ? 'Search chat by username…' : 'Search in messages…';
    });
    if (!q) { setSearchInfo(''); drawMarks([]); }
    rebuild();
  }
  /** The search + "you" bar, built in the main window and in the pop-up. */
  function buildChatBar(doc, bar) {
    bar.replaceChildren();
    const inp = doc.createElement('input'); inp.type = 'search'; inp.value = search.q;
    inp.placeholder = search.field === 'name' ? 'Search chat by username…' : 'Search in messages…';
    inp.setAttribute('list', 'chatUsers'); inp.spellcheck = false;
    let t = null;
    inp.addEventListener('input', () => { clearTimeout(t); t = setTimeout(() => setSearch(inp.value.trim()), 150); });
    inp.addEventListener('keydown', e => { if (e.key === 'Escape') { inp.value = ''; setSearch(''); } e.stopPropagation(); });
    const sel = doc.createElement('select');
    [['name', 'User'], ['text', 'Message']].forEach(([v, l]) => { const o = doc.createElement('option'); o.value = v; o.textContent = l; sel.appendChild(o); });
    sel.value = search.field; sel.title = 'Search in usernames or in message text';
    sel.addEventListener('change', () => setSearch(search.q, sel.value));
    const mine = doc.createElement('button'); mine.textContent = 'Me'; mine.title = 'Show your own messages';
    mine.addEventListener('click', () => { if (!meName) { meRow.style.display = 'flex'; meIn.focus(); return; } setSearch(meName, 'name'); });
    const info = doc.createElement('div'); info.className = 'info';
    // "You are": the name to highlight

    const meLbl = doc.createElement('span'); meLbl.textContent = 'You are';
    const meIn = doc.createElement('input'); meIn.placeholder = 'your Twitch name'; meIn.value = meName; meIn.spellcheck = false;
    meIn.addEventListener('keydown', e => { e.stopPropagation(); if (e.key === 'Enter') meIn.blur(); });
    meIn.addEventListener('change', () => {

    meToggle.addEventListener('click', () => { meRow.style.display = meRow.style.display === 'none' ? 'flex' : 'none'; });
    bar.append(inp, sel, mine, meToggle);
    if (chatTr) {

      const have = messages.filter(m => chatTr[m.text]).length;

      tb.addEventListener('click', () => {

        else toast(showTr ? 'Chat translated to ' + langName(chatTrLang) + ': ' + have + ' messages (hover one for the original)' : 'Chat in the original languages', 3000);
        try { localStorage.setItem('stream-player-chat-tr', showTr ? '1' : '0'); } catch (e) {}
        forEachBar(b => { const x = b.querySelector('button.trbtn'); if (x) x.className = 'trbtn' + (showTr ? ' on' : ''); });

  function fillUserList(doc) {
    let dl = doc.getElementById('chatUsers');
    if (!dl) { dl = doc.createElement('datalist'); dl.id = 'chatUsers'; doc.body.appendChild(dl); }
    const count = new Map();
    messages.forEach(m => { if (m.name) count.set(m.name, (count.get(m.name) || 0) + 1); });
    dl.replaceChildren(...[...count.entries()].sort((a, b) => b[1] - a[1]).slice(0, 500)
      .map(([n, k]) => Object.assign(doc.createElement('option'), { value: n, label: k + ' messages' })));
  }

  function rebuild() {
    const c = container();
    if (!c) return;
    if (search.q) { renderResults(c); return; }
    const doc = c.ownerDocument;
    c.replaceChildren();
    const upto = lastIndexAt(video.currentTime);
    const from = Math.max(0, upto - 150);
    const frag = doc.createDocumentFragment();
    for (let i = from; i <= upto; i++) frag.appendChild(msgEl(doc, messages[i]));
    if (!messages.length) frag.appendChild(Object.assign(doc.createElement('div'), { className: 'msg mod', textContent: 'No chat in this recording.' }));
    c.appendChild(frag);
    shownUntil = upto;
    c.scrollTop = c.scrollHeight;
  }

  function tick() {
    const c = container();
    if (c && messages.length && !search.q) {
      const upto = lastIndexAt(video.currentTime);
      if (upto < shownUntil || upto - shownUntil > 300) {
        rebuild(); // seeked backwards or jumped far ahead
      } else if (upto > shownUntil) {
        const stick = nearBottom(c);
        const doc = c.ownerDocument;
        for (let i = shownUntil + 1; i <= upto; i++) c.appendChild(msgEl(doc, messages[i]));
        shownUntil = upto;
        while (c.childElementCount > 400) c.removeChild(c.firstChild);
        if (stick) c.scrollTop = c.scrollHeight;
      }
    }
    if (mode === 'popup' && popup && popup.closed) { popup = null; setMode('dock'); }
    requestAnimationFrame(tick);
  }

  // ------------------------------------------------------------ pop-up window
  function openPopup() {
    if (popup && !popup.closed) { popup.focus(); return true; }
    popup = window.open('', 'stream-chat', 'width=420,height=780,menubar=no,toolbar=no,location=no,status=no');
    if (!popup) return false;
    const d = popup.document;
    d.open();
    d.write('<!DOCTYPE html><html><head><meta charset="utf-8"><title></title></head><body></body></html>');
    d.close();
    d.title = title;
    const style = d.createElement('style');
    style.textContent = [...document.querySelectorAll('style')].map(s => s.textContent).join('\n') +
      'body{display:flex;flex-direction:column;height:100vh;margin:0;background:var(--panel)}' +
      '#bar{display:flex;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line);align-items:center}' +
      '#bar .t{flex:1;color:var(--muted);font-size:12px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}' +
      '#chat{flex:1;overflow-y:auto;padding:8px 10px}';
    d.head.appendChild(style);
    const bar = d.createElement('div'); bar.id = 'bar';
    const t = d.createElement('span'); t.className = 't'; t.textContent = title; bar.appendChild(t);
    [['A−', -1], ['A+', 1]].forEach(([label, step]) => {
      const b = d.createElement('button'); b.textContent = label; b.title = 'Text size';
      b.onclick = () => setChatSize(chatSize + step); bar.appendChild(b);
    });
    const back = d.createElement('button'); back.textContent = 'Dock'; back.title = 'Put chat back next to the video';
    back.onclick = () => setMode('dock'); bar.appendChild(back);
    const cbar = d.createElement('div'); cbar.className = 'chatbar'; cbar.id = 'popBar';
    const chat = d.createElement('div'); chat.id = 'chat';

  function setMode(m) {
    if (m === 'popup') {
      if (!openPopup()) {
        toast('The browser blocked the pop-up. Allow pop-ups for this page, then click "Pop out chat" again.', 6000);
        m = 'dock';
      }
    }
    if (m === 'dock' && popup && !popup.closed) { const p = popup; popup = null; p.close(); }
    mode = m;
    dock.classList.toggle('show', m === 'dock');
    rebuild();
  }

  function applyChatSize() {

  function setChatSize(n) { chatSize = Math.min(28, Math.max(10, n)); applyChatSize(); }

  // ------------------------------------------------------------ offset
  function setOffset(v) {

    document.getElementById('offset').textContent = (offset > 0 ? '+' : '') + offset.toFixed(1) + 's';
    try { if (storageKey) localStorage.setItem(storageKey, String(offset)); } catch (e) {}
    rebuild();

  document.querySelectorAll('[data-off]').forEach(b => b.addEventListener('click', () => setOffset(offset + parseFloat(b.dataset.off))));

  // ------------------------------------------------------------ loading
  async function load(files) {
    files = [...files];
    const byName = n => files.find(f => f.name.toLowerCase() === n);
    const playable = files.filter(f => /\.(mp4|m4v|webm|mkv|mov)$/i.test(f.name)).sort((a, b) => b.size - a.size);
    const vid = byName('video.mp4') || playable[0];
    const chatFile = byName('chat.txt') || files.find(f => /chat.*\.txt$/i.test(f.name));
    const metaFile = byName('meta.json');

    if (!vid) {
      if (files.some(f => /\.ts$/i.test(f.name))) {
        toast('This recording is still a .ts file, which browsers can\'t play. Convert it first: ffmpeg -i video.ts -c copy video.mp4', 9000);
      } else {
        toast('No video found. Pick a recording folder with video.mp4 in it.', 6000);
      }
      return;
    }
    if (videoUrl) URL.revokeObjectURL(videoUrl);
    videoUrl = URL.createObjectURL(vid);
    const ex = extrasFromFiles(files);
    start({ url: videoUrl, name: vid.name, size: vid.size,
      chatText: chatFile ? await chatFile.text() : null,
      metaText: metaFile ? await metaFile.text() : null,
      subs: ex.subs, chatTrs: await Promise.all(ex.chats.map(async f => ({ lang: '', text: await f.text() }))) });
  }

  // Shared by local files and recordings opened from the dashboard.
  function start(src) {
    const chatFile = src.chatText != null;
    const vid = { name: src.name, size: src.size };
    // Sync info: from the "#META" first line of chat.txt, or from meta.json (older recordings).
    let chatText = src.chatText || '';
    let headerMeta = null;
    const hm = /^#META (.*)\r?\n/.exec(chatText);
    if (hm) { try { headerMeta = JSON.parse(hm[1]); } catch (e) {} }
    let fileMeta = null;
    if (src.metaText) { try { fileMeta = JSON.parse(src.metaText); } catch (e) {} }
    const meta = Object.assign({}, headerMeta || {}, fileMeta || {});
    const startMs = meta.video_start ? parseLocal(meta.video_start) : null;
    messages = chatFile ? parseChat(chatText, startMs, makeMapper(meta, startMs)) : [];

    // Older recording (sync info only in meta.json): offer a chat.txt that has it built in.
    const saveBtn = document.getElementById('saveChatBtn');
    saveBtn.style.display = (chatFile && fileMeta && !headerMeta && fileMeta.video_start && !src.remote) ? '' : 'none';
    saveBtn.onclick = () => {
      const keep = {};
      ['channel', 'title', 'game', 'stream_started', 'stream_ended', 'video_start', 'timeline', 'timezone']
        .forEach(k => { if (fileMeta[k] != null) keep[k] = fileMeta[k]; });
      const blob = new Blob(['#META ' + JSON.stringify(keep) + '\n' + chatText], { type: 'text/plain;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'chat.txt';
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 5000);
      toast('Saved chat.txt with the sync info built in. Replace the old chat.txt with it; meta.json is then no longer needed.', 8000);
    };

    setupExtras(src.subs || [], src.chatTrs || []);
    video.src = src.url;
    // Opened from a time in an AI summary (…#t=seconds): start there.
    const jump = /(?:^#|&)t=(\d+)/.exec(location.hash);
    if (jump) video.addEventListener('loadedmetadata', () => { video.currentTime = Math.min(+jump[1], (video.duration || 1e9) - 1); }, { once: true });
    setupThumbs(src.url, !src.remote);
    if (!mePinned && src.me) { meName = String(src.me); }
    fillUserList(document);
    buildChatBar(document, document.getElementById('dockBar'));
    if (popup && !popup.closed) { buildChatBar(popup.document, popup.document.getElementById('popBar')); fillUserList(popup.document); }
    search.q = '';

    title = (meta.channel ? meta.channel + ' – ' : '') + (meta.title || vid.name);
    document.title = title + ' · Stream player';
    const info = document.getElementById('info');
    info.replaceChildren();
    const b = document.createElement('b'); b.textContent = meta.title || vid.name; info.appendChild(b);
    info.appendChild(document.createTextNode(' · ' + [meta.channel, meta.stream_started && meta.stream_started.slice(0, 16), messages.length + ' chat messages'].filter(Boolean).join(' · ')));

    storageKey = 'stream-player-offset:' + (meta.video_start || vid.name + vid.size);
    let saved = 0;
    try { saved = parseFloat(localStorage.getItem(storageKey) || '0') || 0; } catch (e) {}
    document.getElementById('start').style.display = 'none';
    setOffset(saved);
    if (popup && !popup.closed) popup.document.title = title;

    if (chatFile && startMs == null) {
      toast('No sync info found (older recording): chat is aligned to its first message. Use the Chat sync buttons to adjust.', 8000);
    }
    if (mode === 'dock' && !dock.classList.contains('show')) setMode('dock');

  // Opened from the recorder dashboard: the recording comes from the server.
  async function loadRemote(src) {
    document.getElementById('start').style.display = 'none';
    toast('Loading chat…', 2000);
    const get = async u => {
      if (!u) return null;
      const r = await fetch(u, { credentials: 'same-origin' });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.text();
    };
    try {
      const [chatText, metaText] = await Promise.all([get(src.chat), get(src.meta)]);
      const extras = src.extras || [];
      const chatTrs = await Promise.all(extras.filter(x => x.kind === 'chat').map(async x => ({ lang: x.lang, text: await get(x.url).catch(() => '') })));
      start({ url: src.video, name: src.name, size: src.size, chatText, metaText, remote: true, me: src.me,
        subs: extras.filter(x => x.kind === 'subs').map(x => ({ url: x.url, lang: x.lang, original: !!x.original })), chatTrs });
    } catch (e) {
      toast('Could not load this recording (' + e.message + '). Reload the page to try again.', 10000);
    }
  }
  // ------------------------------------------------------------ download to this PC, then play
  // Opened from the dashboard: offer to download first (smooth playback) or stream from the server.
  // The download goes into a folder you pick once (remembered), in 8 MB pieces with retries, and is
  // saved every 256 MB, so an interrupted download continues where it stopped.
  const CHUNK = 8 * 1048576, BATCH = 256 * 1048576, PARALLEL = 3;
  let dlAbort = null;

  function idb(op, key, val) {
    return new Promise((res, rej) => {
      const rq = indexedDB.open('stream-player', 1);
      rq.onupgradeneeded = () => rq.result.createObjectStore('kv');
      rq.onerror = () => rej(rq.error);
      rq.onsuccess = () => {
        try {
          const tx = rq.result.transaction('kv', op === 'get' ? 'readonly' : 'readwrite');
          const st = tx.objectStore('kv');
          const r = op === 'get' ? st.get(key) : st.put(val, key);
          r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
        } catch (e) { rej(e); } // e.g. this browser can't store folder handles: just ask again next time
      };
    });
  }
  const gb = b => b >= 1073741824 ? (b / 1073741824).toFixed(2) + ' GB' : (b / 1048576).toFixed(0) + ' MB';
  const safeName = n => n.replace(/[<>:"/\\|?*\x00-\x1f]/g, '_').trim().slice(0, 120);

  async function pickRoot(forceNew, ui) {
    let root = forceNew ? null : await idb('get', 'dir').catch(() => null);
    if (root) {
      let perm = await root.queryPermission({ mode: 'readwrite' }).catch(() => 'denied');
      if (perm !== 'granted') {
        // Chrome asks again after a restart; its question appears next to the address bar.
        ui.busy('Allow access to your folder "' + root.name + '" in the question next to the address bar…', 0, '');
        perm = await root.requestPermission({ mode: 'readwrite' }).catch(() => 'denied');
      }
      if (perm !== 'granted') root = null;
    }
    if (!root) {
      root = await window.showDirectoryPicker({ id: 'stream-recordings', mode: 'readwrite', startIn: 'videos' });
      await idb('put', 'dir', root).catch(() => {});
    }
    return root;
  }

  async function fetchRange(url, start, end, signal) {
    for (let attempt = 1; ; attempt++) {
      try {
        const r = await fetch(url, { credentials: 'same-origin', headers: { Range: 'bytes=' + start + '-' + end }, signal });
        if (r.status !== 206 && !(r.status === 200 && start === 0)) throw new Error('HTTP ' + r.status);
        const buf = new Uint8Array(await r.arrayBuffer());
        if (buf.length !== end - start + 1) throw new Error('got ' + buf.length + ' of ' + (end - start + 1) + ' bytes');
        return buf;
      } catch (e) {
        if (signal.aborted || attempt >= 6) throw e;
        await new Promise(res => setTimeout(res, 1000 * attempt * attempt)); // 1, 4, 9, 16, 25 s
      }
    }
  }

  async function writeText(dir, name, text) {
    const w = await (await dir.getFileHandle(name, { create: true })).createWritable();
    await w.write(text); await w.close();
  }

  async function downloadAndPlay(src, forceNewFolder) {
    const ui = remoteUi;
    let root, dir;
    try {
      root = await pickRoot(forceNewFolder, ui);
      ui.busy('Checking what is already on this PC…', 0, '');
      dir = await root.getDirectoryHandle(safeName((src.channel || 'stream') + ' ' + src.name), { create: true });
    } catch (e) {
      if (e.name === 'AbortError') { ui.error(''); return; }   // folder picker closed
      ui.error(root && e.name === 'NotFoundError'
        ? 'Your download folder "' + root.name + '" can\'t be found anymore (moved or renamed?). Click Change folder and pick it again.'
        : 'Could not use that folder: ' + e.message + '. Click Change folder to pick it again.');
      return;
    }
    ui.busy('Downloading chat…', 0, '');
    dlAbort = new AbortController();
    const signal = dlAbort.signal;
    window.addEventListener('beforeunload', warnLeave);
    try {
      // Chat and meta first (small).
      const extraFiles = (src.extras || []).map(x => [x.url, x.name]);
      for (const [url, name] of [[src.chat, 'chat.txt'], [src.meta, 'meta.json']].concat(extraFiles)) {
        if (!url) continue;
        const r = await fetch(url, { credentials: 'same-origin', signal });
        if (!r.ok) throw new Error(name + ': HTTP ' + r.status);
        await writeText(dir, name, await r.text());
      }
      // Video, resuming a partial download.
      const fh = await dir.getFileHandle('video.mp4', { create: true });
      let have = (await fh.getFile()).size;
      let incomplete = true;
      try { await dir.getFileHandle('download-incomplete.txt'); } catch (e) { incomplete = false; }
      if (have === src.size && !incomplete) { ui.busy('Already downloaded - opening…', 100, ''); }
      else {
        if (have > src.size) have = 0;
        await writeText(dir, 'download-incomplete.txt', 'video.mp4 is not complete yet. Open the recording from the dashboard again to continue the download.\n');
        const t0 = performance.now(), start0 = have;
        const limit = Math.max(0, +(src.dl_limit_mb || 0)) * 1048576; // bytes per second, 0 = no cap
        const chunk = limit ? 2 * 1048576 : CHUNK, par = limit ? 2 : PARALLEL;
        let paceAt = performance.now();
        const pace = n => {   // reserve a start time synchronously, then wait for it
          if (!limit) return Promise.resolve();
          const now = performance.now(), at = Math.max(paceAt, now);
          paceAt = at + n / limit * 1000;
          return at > now ? new Promise(r => setTimeout(r, at - now)) : Promise.resolve();
        };
        while (have < src.size) {
          const w = await fh.createWritable({ keepExistingData: true });
          await w.truncate(have);
          await w.seek(have);
          const batchEnd = Math.min(src.size, have + BATCH);
          try {
            // A steady pipeline: a few pieces in flight, written in order. With a speed cap (your host's
            // disk IO limit, from the dashboard) the pieces are small and their start times evenly
            // spaced, so the server reads at a constant rate instead of in bursts.
            let next = have;
            const queue = [];
            const launch = async () => {
              const s0 = next, e0 = Math.min(next + chunk, batchEnd) - 1;
              next = e0 + 1;
              await pace(e0 - s0 + 1);
              const p = fetchRange(src.video, s0, e0, signal);
              p.catch(() => {}); // a pause cancels the rest; handled below
              return p;
            };
            while (have < batchEnd) {
              while (queue.length < par && next < batchEnd) { const j = launch(); j.catch(() => {}); queue.push(j); }
              const buf = await queue.shift();
              await w.write(buf);
              have += buf.length;
              const secs = (performance.now() - t0) / 1000;
              const rate = (have - start0) / Math.max(secs, 0.5);
              ui.busy('Downloading video…', 100 * have / src.size,
                gb(have) + ' of ' + gb(src.size) + ' · ' + (rate / 1048576).toFixed(1) + ' MB/s' +
                (limit ? ' (capped at ' + (limit / 1048576).toFixed(1) + ')' : '') +
                (rate > 0 ? ' · ~' + Math.max(1, Math.round((src.size - have) / rate / 60)) + ' min left' : ''));
            }
          } finally {
            await w.close(); // saves what has been written so far
          }
        }
        await dir.removeEntry('download-incomplete.txt').catch(() => {});
      }
      window.removeEventListener('beforeunload', warnLeave);
      dlAbort = null;
      const files = [await fh.getFile()];
      for (const n of ['chat.txt', 'meta.json'].concat(extraFiles.map(x => x[1]))) {
        try { files.push(await (await dir.getFileHandle(n)).getFile()); } catch (e) {}
      }
      ui.hide();
      await load(files);
      toast('Saved on this PC in "' + root.name + '/' + dir.name + '" - playing from there.', 6000);
    } catch (e) {
      window.removeEventListener('beforeunload', warnLeave);
      dlAbort = null;
      ui.error(signal.aborted ? 'Download paused. Click Download again to continue where it stopped.'
                              : 'Download stopped: ' + e.message + '. Click Download again to continue where it stopped.');
    }
  }
  function warnLeave(e) { e.preventDefault(); e.returnValue = ''; }

  let remoteUi = null;
  function showRemoteChoice(src) {
    const drop = document.getElementById('drop');
    drop.replaceChildren();
    const h = document.createElement('h2'); h.textContent = src.title || src.name;
    const p = document.createElement('p');
    p.textContent = [src.channel, gb(src.size) + ' video', src.chat ? 'with chat' : 'no chat'].filter(Boolean).join(' · ');
    const row = document.createElement('div'); row.className = 'row';
    const canSave = typeof window.showDirectoryPicker === 'function';
    const dl = document.createElement('button'); dl.className = 'primary'; dl.textContent = 'Download to this PC, then play';
    const st = document.createElement('button'); st.textContent = 'Stream from the server';
    const other = document.createElement('button'); other.textContent = 'Change folder'; other.title = 'Pick another download folder';
    const bar = document.createElement('div'); bar.className = 'dlbar'; const fill = document.createElement('i'); bar.appendChild(fill);
    const status = document.createElement('div'); status.className = 'dlstatus';
    const detail = document.createElement('small');
    const stop = document.createElement('button'); stop.textContent = 'Pause download'; stop.style.display = 'none';
    stop.onclick = () => { if (dlAbort) dlAbort.abort(); };
    bar.style.display = 'none';
    if (canSave) {
      row.append(dl, st);
      detail.textContent = 'The first time you choose a folder on your PC (e.g. Videos); each recording gets its own folder in it with video.mp4 and chat.txt, which also open in the PC player later. Streaming plays right away but can stutter.';
      idb('get', 'dir').then(d => { if (d) { detail.textContent = 'Downloads go to your folder "' + d.name + '". Streaming plays right away but can stutter.'; row.appendChild(other); } }).catch(() => {});
    } else {
      // No folder access in this browser (e.g. Firefox): plain downloads, then open them with Open… .
      const a1 = document.createElement('a'); a1.className = 'btn primary'; a1.textContent = 'Download video'; a1.href = src.video + '&dl=1';
      row.append(a1);
      if (src.chat) { const a2 = document.createElement('a'); a2.className = 'btn'; a2.textContent = 'Download chat'; a2.href = src.chat + '&dl=1'; row.append(a2); }
      row.append(st);
      detail.textContent = 'This browser can\'t save into a folder directly (Chrome and Edge can). Download both files into one folder, then use Open… . A very long download may break off; the browser\'s Resume continues it.';
    }
    const go = force => { dl.disabled = other.disabled = st.disabled = true; downloadAndPlay(src, force); };
    dl.onclick = () => go(false);
    other.onclick = () => go(true);
    st.onclick = () => loadRemote(src);
    drop.append(h, p, row, bar, status, stop, detail);
    remoteUi = {
      busy(msg, pct, sub) {
        bar.style.display = ''; fill.style.width = (pct || 0).toFixed(1) + '%';
        status.textContent = msg + (sub ? ' ' + sub : ''); status.classList.remove('err');
        stop.style.display = dlAbort ? '' : 'none';
      },
      error(msg) {
        status.textContent = msg; status.classList.add('err'); stop.style.display = 'none';
        dl.disabled = other.disabled = st.disabled = false;
        dl.textContent = 'Download to this PC, then play';
      },
      hide() { stop.style.display = 'none'; },
    };
  }
  if (window.PLAYER_SOURCE) showRemoteChoice(window.PLAYER_SOURCE);

  document.getElementById('pickDir').addEventListener('change', e => { if (e.target.files.length) load(e.target.files); e.target.value = ''; });
  document.getElementById('pickFiles').addEventListener('change', e => { if (e.target.files.length) load(e.target.files); e.target.value = ''; });
  const drop = document.getElementById('drop');
  ['dragenter', 'dragover'].forEach(ev => document.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
  ['dragleave', 'drop'].forEach(ev => document.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
  document.addEventListener('drop', e => { if (e.dataTransfer.files.length) load(e.dataTransfer.files); });

  document.getElementById('popBtn').addEventListener('click', () => setMode('popup'));
  document.getElementById('dockBtn').addEventListener('click', () => setMode('dock'));
  video.addEventListener('seeked', rebuild);

  // ------------------------------------------------------------ controls + seek-bar previews
  const stage = document.getElementById('stage');
  const seek = document.getElementById('seek');
  const seekPlay = document.getElementById('seekPlay'), seekBuf = document.getElementById('seekBuf'), knob = document.getElementById('seekKnob');
  const preview = document.getElementById('preview'), pvCanvas = document.getElementById('pvCanvas'), pvTime = document.getElementById('pvTime');
  const ICONS = {
    play: '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>',
    pause: '<svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>',
    back: '<svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/><text x="12" y="16" font-size="7" text-anchor="middle" font-family="sans-serif" font-weight="700">10</text></svg>',
    fwd: '<svg viewBox="0 0 24 24"><path d="M12 5V1l5 5-5 5V7a6 6 0 1 0 6 6h2a8 8 0 1 1-8-8z"/><text x="12" y="16" font-size="7" text-anchor="middle" font-family="sans-serif" font-weight="700">10</text></svg>',
    vol: '<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>',
    mute: '<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm18.6 3-2.8-2.8-1.4 1.4 2.8 2.8-2.8 2.8 1.4 1.4 2.8-2.8 2.8 2.8 1.4-1.4-2.8-2.8 2.8-2.8-1.4-1.4z"/></svg>',
    full: '<svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>',
    exit: '<svg viewBox="0 0 24 24"><path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/></svg>',
  };
  const $c = id => document.getElementById(id);
  $c('cBack').innerHTML = ICONS.back; $c('cFwd').innerHTML = ICONS.fwd; $c('cFull').innerHTML = ICONS.full; // fixed SVG markup only
  function togglePlay() { if (!video.src) return; video.paused ? video.play() : video.pause(); }
  function updButtons() {
    $c('cPlay').innerHTML = video.paused ? ICONS.play : ICONS.pause;
    $c('cMute').innerHTML = video.muted || video.volume === 0 ? ICONS.mute : ICONS.vol;
    $c('cFull').innerHTML = document.fullscreenElement ? ICONS.exit : ICONS.full;
  }
  function updTime() {
    const d = video.duration || 0, t = video.currentTime || 0;
    const pct = d ? Math.min(100, t / d * 100) : 0;
    seekPlay.style.width = pct + '%'; knob.style.left = pct + '%';
    let buf = 0;
    for (let i = 0; i < video.buffered.length; i++) if (video.buffered.start(i) <= t + 1) buf = Math.max(buf, video.buffered.end(i));
    seekBuf.style.width = (d ? Math.min(100, buf / d * 100) : 0) + '%';
    $c('cTime').textContent = fmt(t) + ' / ' + fmt(d);
  }
  ['timeupdate', 'durationchange', 'progress', 'seeked'].forEach(ev => video.addEventListener(ev, updTime));
  ['play', 'pause', 'volumechange'].forEach(ev => video.addEventListener(ev, updButtons));
  document.addEventListener('fullscreenchange', updButtons);
  $c('cPlay').onclick = togglePlay;
  $c('cBack').onclick = () => { video.currentTime = Math.max(0, video.currentTime - 10); };
  $c('cFwd').onclick = () => { video.currentTime = Math.min(video.duration || 0, video.currentTime + 10); };
  $c('cMute').onclick = () => { video.muted = !video.muted; };
  $c('cVol').oninput = e => { video.volume = +e.target.value; video.muted = video.volume === 0; };
  $c('cRate').onchange = e => { video.playbackRate = +e.target.value; };
  function toggleFull() { document.fullscreenElement ? document.exitFullscreen() : stage.requestFullscreen().catch(() => {}); }
  $c('cFull').onclick = toggleFull;
  // Buttons let go of the keyboard after a click, so Space keeps meaning play/pause.
  document.querySelectorAll('#ctrlRow button, #ctrlRow select').forEach(b => b.addEventListener('click', () => { if (b.tagName === 'BUTTON') b.blur(); }));
  $c('cRate').addEventListener('change', e => e.target.blur());
  video.addEventListener('click', togglePlay);
  video.addEventListener('dblclick', toggleFull);
  // hide the controls while playing and the mouse rests
  let idleT = null;
  function wake() { stage.classList.remove('idle'); clearTimeout(idleT); idleT = setTimeout(() => { if (!video.paused) stage.classList.add('idle'); }, 2500); }
  stage.addEventListener('mousemove', wake); video.addEventListener('pause', wake); video.addEventListener('play', wake);

  // seeking by click/drag
  function seekFrac(ev) { const r = seek.getBoundingClientRect(); return Math.min(1, Math.max(0, (ev.clientX - r.left) / r.width)); }
  let dragging = false;
  seek.addEventListener('pointerdown', ev => { if (!video.duration) return; dragging = true; seek.setPointerCapture(ev.pointerId); video.currentTime = seekFrac(ev) * video.duration; });
  seek.addEventListener('pointerup', () => { dragging = false; });
  seek.addEventListener('pointermove', ev => {
    if (!video.duration) return;
    const f = seekFrac(ev), t = f * video.duration;
    const r = seek.getBoundingClientRect();
    preview.style.left = Math.min(r.width - 100, Math.max(100, f * r.width)) + 'px';
    pvTime.textContent = fmt(t);
    if (dragging) video.currentTime = t;
    wantThumb(t);
  });

  // Preview pictures: a second, hidden copy of the video is moved to the hovered moment and
  // its frame copied. Remembered per position, so hovering back is instant.
  const thumbVideo = document.createElement('video');
  thumbVideo.muted = true; thumbVideo.preload = 'auto'; thumbVideo.playsInline = true;
  Object.assign(thumbVideo.style, { position: 'fixed', left: '-9999px', top: '0', width: '192px', height: '108px' });
  document.body.appendChild(thumbVideo);
  const pvCtx = pvCanvas.getContext('2d');
  const thumbs = new Map();             // slot -> canvas
  let thumbStep = 5, thumbBusy = false, thumbWanted = null, thumbsOn = false;
  function thumbSlot(t) { return Math.round(t / thumbStep); }
  function showThumb(cv) { pvCanvas.classList.remove('none'); pvCtx.drawImage(cv, 0, 0); }
  function wantThumb(t) {
    if (!thumbsOn) { pvCanvas.classList.add('none'); return; }
    const k = thumbSlot(t);
    const cached = thumbs.get(k);
    if (cached) { showThumb(cached); return; }
    thumbWanted = k;
    if (!thumbBusy) grabThumb();
  }
  function grabThumb() {
    if (thumbWanted === null) return;
    const k = thumbWanted; thumbWanted = null; thumbBusy = true;
    const done = () => {
      thumbVideo.removeEventListener('seeked', done);
      try {
        const cv = document.createElement('canvas'); cv.width = 192; cv.height = 108;
        const vw = thumbVideo.videoWidth || 16, vh = thumbVideo.videoHeight || 9;
        const sc = Math.min(192 / vw, 108 / vh), w = vw * sc, h = vh * sc;
        const cx = cv.getContext('2d'); cx.fillStyle = '#000'; cx.fillRect(0, 0, 192, 108);
        cx.drawImage(thumbVideo, (192 - w) / 2, (108 - h) / 2, w, h);
        thumbs.set(k, cv);
        if (thumbs.size > 400) thumbs.delete(thumbs.keys().next().value);
        if (thumbWanted === null || thumbWanted === k) showThumb(cv);
      } catch (e) {}
      thumbBusy = false;
      if (thumbWanted !== null) grabThumb();
    };
    thumbVideo.addEventListener('seeked', done);
    thumbVideo.currentTime = Math.min(k * thumbStep, Math.max(0, (thumbVideo.duration || 0) - 0.5));
  }
  /** Previews for local files; for streaming from the server they'd download extra video, so off. */
  function setupThumbs(url, local) {
    thumbs.clear(); thumbWanted = null; thumbBusy = false;
    thumbsOn = !!local;
    if (thumbsOn) {
      thumbVideo.src = url;
      thumbVideo.addEventListener('loadedmetadata', () => { thumbStep = Math.max(2, (thumbVideo.duration || 0) / 600); }, { once: true });
    } else thumbVideo.removeAttribute('src');
  }
  /** Search hits as ticks on the seek bar. */
  function drawMarks(res) {
    const box = document.getElementById('seekMarks'); box.replaceChildren();
    const d = video.duration; if (!d || !res.length) return;
    const seen = new Set();
    res.forEach(m => {
      const p = Math.round(Math.min(1, Math.max(0, (m.t + offset) / d)) * 400);
      if (seen.has(p)) return; seen.add(p);
      const b = document.createElement('b'); b.style.left = (p / 4) + '%'; box.appendChild(b);
    });
  }
  video.addEventListener('durationchange', () => { if (search.q) drawMarks(searchResults()); });
  updButtons(); updTime();

  function onKey(e) {
    if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
    if (e.key === ' ' || e.key === 'k' || e.key === 'K') { e.preventDefault(); togglePlay(); }
    else if (e.key === 'ArrowRight') { video.currentTime += 5; }
    else if (e.key === 'ArrowLeft') { video.currentTime -= 5; }
    else if (e.key === 'm' || e.key === 'M') { video.muted = !video.muted; }
    else if (e.key === 'f' || e.key === 'F') { toggleFull(); }
    else if (e.key === 'c' || e.key === 'C') { setMode(mode === 'popup' ? 'dock' : 'popup'); }
  }
  document.addEventListener('keydown', onKey);
  window.addEventListener('beforeunload', () => { if (popup && !popup.closed) popup.close(); });

  requestAnimationFrame(tick);
})();
</script>
</body>
